  <rect x="410" y="175" width="220" height="52" rx="12" class="node"/><text x="520" y="207" class="text">FastAPI + SSE</text>
  <rect x="705" y="175" width="240" height="52" rx="12" class="node"/><text x="825" y="198" class="text">CLI / Voice / MCP</text><text x="825" y="216" class="small">MCP reads only</text>
