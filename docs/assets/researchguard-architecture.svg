<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102c46"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#69d7ff"/></marker>
    <style>
      .title{font:700 34px system-ui;fill:#edf4ff}.subtitle{font:18px system-ui;fill:#9fb1c9}.lane{fill:#101d30;stroke:#2b4261;stroke-width:2}.laneTitle{font:700 19px system-ui;fill:#37dda8}.node{fill:#162740;stroke:#69d7ff;stroke-width:2}.human{fill:#4a3912;stroke:#ffc857;stroke-width:3}.store{fill:#182d29;stroke:#37dda8;stroke-width:2}.text{font:700 15px system-ui;fill:#edf4ff;text-anchor:middle}.small{font:13px system-ui;fill:#9fb1c9;text-anchor:middle}.edge{stroke:#69d7ff;stroke-width:2;fill:none;marker-end:url(#arrow)}.loop{stroke:#ffc857;stroke-width:2;fill:none;stroke-dasharray:8 5;marker-end:url(#arrow)}
