  <rect x="535" y="355" width="170" height="58" rx="12" class="node"/><text x="620" y="380" class="text">Hypothesis</text><text x="620" y="400" class="small">mechanism + falsifier</text>
  <rect x="765" y="355" width="170" height="58" rx="12" class="node"/><text x="850" y="380" class="text">Methods</text><text x="850" y="400" class="small">study design</text>
