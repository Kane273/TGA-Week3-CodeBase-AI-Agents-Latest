name: ResearchGuard CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --extra openai
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=researchguard --cov-report=term-missing
      - run: uv run researchguard-security-check --skip-tests --skip-audits
      - run: docker build -t researchguard:test .

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --extra dev --extra openai
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
