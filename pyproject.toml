[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchguard"
version = "0.3.0"
description = "A stateful multi-agent research design and review council built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tenacity>=9.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.12",
  "elevenlabs>=2.0",
  "psycopg[binary,pool]>=3.2",
  "mcp[cli]>=2.0,<3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7", "pip-audit>=2.7"]

[project.scripts]
researchguard = "researchguard.cli:app"
researchguard-api = "researchguard.api:main"
researchguard-eval = "researchguard.langsmith_eval:main"
researchguard-local-eval = "researchguard.local_eval:main"
researchguard-mcp = "researchguard.mcp_server:main"
researchguard-security-check = "researchguard.security_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/researchguard"]

[tool.hatch.build]
include = ["src/researchguard/**", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/researchguard/cli.py" = ["B008"]
"src/researchguard/api.py" = ["B008"]
